<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Calculator</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sudoku Calculator</h1>
            <p>Find number combinations that sum to a specific value with constraints</p>
        </header>

        <main>
            <div class="main-content">
                <div class="form-container">
                    <form id="sudokuForm">
                    <div class="form-group">
                        <label for="numberOfDigits">Number of Digits:</label>
                        <select id="numberOfDigits" name="numberOfDigits" required>
                            <option value="">Select...</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="value">Target Sum Value:</label>
                        <input type="number" id="value" name="value" required 
                               placeholder="Select number of digits first">
                    </div>

                    <div class="form-group">
                        <label for="includedNumbers">Numbers to Include (must be present):</label>
                        <div class="number-checkboxes">
                            <label><input type="checkbox" name="includedNumbers" value="1"> 1</label>
                            <label><input type="checkbox" name="includedNumbers" value="2"> 2</label>
                            <label><input type="checkbox" name="includedNumbers" value="3"> 3</label>
                            <label><input type="checkbox" name="includedNumbers" value="4"> 4</label>
                            <label><input type="checkbox" name="includedNumbers" value="5"> 5</label>
                            <label><input type="checkbox" name="includedNumbers" value="6"> 6</label>
                            <label><input type="checkbox" name="includedNumbers" value="7"> 7</label>
                            <label><input type="checkbox" name="includedNumbers" value="8"> 8</label>
                            <label><input type="checkbox" name="includedNumbers" value="9"> 9</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="excludedNumbers">Numbers to Exclude (cannot be present):</label>
                        <div class="number-checkboxes">
                            <label><input type="checkbox" name="excludedNumbers" value="1"> 1</label>
                            <label><input type="checkbox" name="excludedNumbers" value="2"> 2</label>
                            <label><input type="checkbox" name="excludedNumbers" value="3"> 3</label>
                            <label><input type="checkbox" name="excludedNumbers" value="4"> 4</label>
                            <label><input type="checkbox" name="excludedNumbers" value="5"> 5</label>
                            <label><input type="checkbox" name="excludedNumbers" value="6"> 6</label>
                            <label><input type="checkbox" name="excludedNumbers" value="7"> 7</label>
                            <label><input type="checkbox" name="excludedNumbers" value="8"> 8</label>
                            <label><input type="checkbox" name="excludedNumbers" value="9"> 9</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="getNumbersNotPresent" name="getNumbersNotPresent">
                            Get numbers not present in any result
                        </label>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="getNumbersPresentAllCombinations" name="getNumbersPresentAllCombinations">
                            Get numbers present in all combinations
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Calculate Combinations</button>
                </form>
                </div>

                <div class="results-section">
                    <div id="results" class="results-container" style="display: none;">
                        <h2>Results</h2>
                        <div id="resultsContent"></div>
                    </div>

                    <div id="error" class="error-container" style="display: none;">
                        <h2>Error</h2>
                        <div id="errorContent"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Sudoku Calculator - Find valid number combinations for your sudoku puzzles</p>
        </footer>
    </div>

    <script src="/static/script.js?v=3"></script>
</body>
</html>
